<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <style>
    :root {
      --paper: #FBFAF8;
      --ink: #1E1B18;
      --muted: #6E675F;
      --flame: #C63A1E;
      --rule: #E4E0DA;
      --pill-bg: #F1EDE7;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Charter, Georgia, 'Times New Roman', serif;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0;
      padding: 0 1.25rem 5rem;
    }
    .wrap { max-width: 65ch; margin: 0 auto; }
    header.site {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem;
      padding: 1.5rem 0 1rem;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 2.5rem;
    }
    .site-name { font-weight: 700; font-size: 1.1rem; }
    .site-name a { color: inherit; text-decoration: none; }
    .site-name .tw { color: var(--flame); }
    .site-tag {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.75rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    h1 { font-size: 1.9rem; line-height: 1.2; text-wrap: balance; margin: 0 0 0.35rem; }
    .post-meta {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.78rem; color: var(--muted);
      margin-bottom: 2.25rem;
    }
    h2 {
      font-size: 1.15rem;
      margin: 2.25rem 0 0.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }
    ul { padding-left: 1.2rem; margin: 0 0 1rem; }
    li { margin-bottom: 0.55rem; }
    a { color: var(--flame); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
    code {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.85em;
      background: var(--pill-bg);
      border-radius: 3px;
      padding: 0.1em 0.3em;
    }
    pre { overflow-x: auto; background: var(--paper); padding: 0.75rem 0; border-radius: 4px; }
    pre code { background: none; padding: 0; }
    .post-list { list-style: none; padding: 0; }
    .post-list li {
      display: flex; align-items: baseline; gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .post-list time {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.78rem; color: var(--muted);
      flex-shrink: 0;
    }
    footer {
      margin-top: 3.5rem;
      padding-top: 1.25rem;
      border-top: 2px solid var(--ink);
      font-size: 0.9rem; color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <span class="site-name"><a href="{{ .Site.Home.RelPermalink }}"><span class="tw">This Week</span> in torch.compile</a></span>
      <span class="site-tag">{{ .Site.Params.description }}</span>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      Inspired by <a href="https://llvmweekly.org/">LLVM Weekly</a>. Digest drafts are generated from the pytorch git log, then human-curated.
    </footer>
  </div>
</body>
</html>
